<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%" fill="none">
  <!-- Background -->
  <rect width="500" height="500" rx="32" fill="#0b0c0e"/>
  
  <!-- "THE" Typography -->
  <text x="250" y="85" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, -apple-system, 'SF Pro Display', sans-serif" font-size="44" font-weight="900" letter-spacing="0.28em">THE</text>
  
  <!-- Subtle Snap Yellow Radial Glow -->
  <defs>
    <radialGradient id="wardenGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFC00" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#FFFC00" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#FFFC00" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadowFilter" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#FFFC00" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <circle cx="250" cy="245" r="140" fill="url(#wardenGlow)"/>

  <!-- Ghost Mascot Group -->
  <g id="ghostMascot" filter="url(#shadowFilter)">
    <!-- Yellow Mascot Body Silhouette with crisp border -->
    <path d="
      M 250 140
      C 200 140, 185 180, 185 220
      C 185 228, 160 226, 155 235
      C 150 245, 165 252, 182 254
      C 178 268, 160 295, 135 308
      C 150 318, 175 305, 195 295
      C 215 328, 235 340, 250 340
      C 265 340, 285 328, 305 295
      C 325 305, 350 318, 365 308
      C 340 295, 322 268, 318 254
      C 335 252, 350 245, 345 235
      C 340 226, 315 228, 315 220
      C 315 180, 300 140, 250 140
      Z
    " fill="#FFFC00" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>

    <!-- Sinister Angled Eyes -->
    <!-- Left Eye -->
    <path d="M 210 196 Q 228 202 240 216 Q 225 215 210 207 Q 202 201 210 196 Z" fill="#000000"/>
    <!-- Right Eye -->
    <path d="M 290 196 Q 272 202 260 216 Q 275 215 290 207 Q 298 201 290 196 Z" fill="#000000"/>

    <!-- Neck Loop / Cord / Lasso -->
    <!-- Outer loop ellipse -->
    <path d="
      M 165 268 
      C 165 254, 335 252, 335 266 
      C 335 280, 225 288, 175 276
      C 160 272, 155 268, 165 268 Z
    " fill="#000000" stroke="#FFFC00" stroke-width="2"/>
    <!-- Inner knot / cord cross -->
    <path d="M 170 272 Q 240 286 325 268" stroke="#000000" stroke-width="7" stroke-linecap="round"/>
    <path d="M 160 268 Q 230 282 315 265" stroke="#FFFC00" stroke-width="2" stroke-linecap="round"/>
    <!-- Hanging loop tail -->
    <path d="M 178 273 C 160 280, 158 292, 180 286 C 195 282, 185 273, 178 273 Z" fill="#000000" stroke="#FFFC00" stroke-width="1.5"/>
  </g>

  <!-- "WARDEN" Typography -->
  <text x="250" y="425" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, -apple-system, 'SF Pro Display', sans-serif" font-size="52" font-weight="900" letter-spacing="0.24em">WARDEN</text>
</svg>
